<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property Assistant · Property Trade Limited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F3F; --gold:#E3A92B; --gold-soft:#FBEBC4; --mist:#E8ECF3; --line:#D5DAE3; --muted:#5B6577; --white:#fff;
  --head:'Raleway','Trebuchet MS',system-ui,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--navy);background:var(--white);font-size:16px;line-height:1.5}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:1fr;height:100dvh;overflow:hidden}
@media(min-width:960px){.app{grid-template-columns:280px minmax(0,1fr) 300px}}

/* Sidebar (desktop) */
.side{display:none;flex-direction:column;gap:16px;padding:24px 20px;border-right:1.5px solid var(--navy)}
.side .logo{height:44px;width:auto;align-self:flex-start}
.side p{margin:0;color:var(--muted);font-size:14px}
@media(min-width:960px){.side{display:flex}}

/* Chat column */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;height:100dvh}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:3px solid var(--gold);background:var(--white)}
.top .logo{height:30px;width:auto;display:block}
.top .ttl{flex:1;min-width:0}
.top h1{margin:0;font-family:var(--head);font-size:17px;font-weight:800;line-height:1.2}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
.status.off .dot{background:var(--muted)}
@media(min-width:960px){.top{padding:16px 28px}.top .logo,.top .newbtn{display:none}.top h1{font-size:19px}}

.log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.log>*{width:100%;max-width:720px;margin-left:auto;margin-right:auto}
.msg{display:flex;flex-direction:column;gap:8px}
.u,.b{max-width:85%;padding:12px 14px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--navy);color:var(--white);border-bottom-right-radius:4px;white-space:pre-wrap}
.b{align-self:flex-start;background:var(--mist);border-bottom-left-radius:4px}
.b p{margin:0 0 8px}.b p:last-child{margin-bottom:0}
.b ul,.b ol{margin:4px 0 8px;padding-left:22px}.b li{margin:2px 0}
.b a{color:var(--navy);text-decoration:underline;text-underline-offset:2px;font-weight:600}
.err{background:var(--white);border:1.5px solid var(--navy)}
.typing{align-self:flex-start;background:var(--mist);border-radius:16px;border-bottom-left-radius:4px;padding:14px 16px;display:flex;gap:5px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bob 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@media(prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.8}.log{scroll-behavior:auto}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border:1.5px solid var(--navy);border-radius:22px;background:var(--white);cursor:pointer;font-size:15px}
.chip:hover{background:var(--gold-soft)}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:24px;background:var(--gold);color:var(--navy);font-weight:600;text-decoration:none;align-self:flex-start;border:1.5px solid var(--navy)}
.cta:hover{filter:brightness(.95)}

/* Composer */
.composer{display:flex;gap:8px;align-items:flex-end;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--navy);background:var(--white)}
.composer .wrap{flex:1;max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;width:100%}
textarea{flex:1;resize:none;min-height:48px;max-height:140px;padding:12px 16px;border:1.5px solid var(--navy);border-radius:24px;background:var(--white);line-height:1.4}
textarea::placeholder{color:var(--muted)}
.send{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--navy);background:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.send:disabled{background:var(--mist);cursor:not-allowed}
.send svg{width:22px;height:22px}
.newbtn{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--navy);background:var(--white);cursor:pointer;font-weight:600}
.primary{min-height:48px;border-radius:24px;border:1.5px solid var(--navy);background:var(--gold);color:var(--navy);font-weight:600;cursor:pointer}

/* Quick actions panel (desktop) */
.help{display:none;flex-direction:column;gap:10px;padding:24px 20px;border-left:1.5px solid var(--navy)}
.help h2{margin:0 0 4px;font-family:var(--head);font-size:16px;font-weight:800}
.help button{min-height:48px;text-align:left;padding:0 16px;border:1.5px solid var(--navy);border-radius:24px;background:var(--white);cursor:pointer}
.help button:hover{background:var(--gold-soft)}
@media(min-width:960px){.help{display:flex}}
</style>
</head>

<script>
/* ---------- Settings: edit these ---------- */
// Paste the PRODUCTION URL from your n8n "When chat message received" node.
// It looks like https://YOUR-INSTANCE.app.n8n.cloud/webhook/<id>/chat
// Leave it empty to preview the interface with sample replies.
const CHAT_WEBHOOK_URL = "https://propertylist.app.n8n.cloud/webhook/0cda95f2-da83-4653-91c3-21ba58b32185/chat";
const ESTATES = ["Gold Town Luxury Estate", "Juniper Estate", "Gold Town Phase 3"];
const START_CHIPS = [
  ["Find estates", "What estates are available?"],
  ["Check survey status", "Can you check my survey status?"],
  ["Pricing and payment plans", "I would like to know the pricing and payment plans."],
  ["Reserve a plot", "I would like to reserve a plot."]
];
const WELCOME = "Hello, I am the Property Assistant. I can help you find estates, check your survey status, work out pricing and reserve a plot. What would you like to do?";
const REQUEST_TIMEOUT_MS = 60000;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send");
const KEY = "ptl_chat_v1";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify({sessionId, messages})); } catch(e){} }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

let saved = load();
let sessionId = saved && saved.sessionId || uid();
let messages = saved && saved.messages || [];
let busy = false, lastUserText = "";

/* Small, safe markdown renderer: bold, links, bullets, numbered lists */
function inline(t){
  t = esc(t);
  t = t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return t;
}
function render(md){
  const lines = md.replace(/\r/g,"").split("\n");
  let out = "", list = null, para = [];
  const flushP = () => { if(para.length){ out += "<p>"+para.join("<br>")+"</p>"; para = []; } };
  const flushL = () => { if(list){ out += "</"+list+">"; list = null; } };
  for(const raw of lines){
    const l = raw.trim();
    let m;
    if((m = l.match(/^(?:[*\-•])\s+(.*)/))){ flushP(); if(list!=="ul"){ flushL(); out+="<ul>"; list="ul"; } out += "<li>"+inline(m[1])+"</li>"; }
    else if((m = l.match(/^\d+[.)]\s+(.*)/))){ flushP(); if(list!=="ol"){ flushL(); out+="<ol>"; list="ol"; } out += "<li>"+inline(m[1])+"</li>"; }
    else if(!l){ flushP(); flushL(); }
    else { flushL(); para.push(inline(l.replace(/^#{1,4}\s+/,""))); }
  }
  flushP(); flushL();
  return out;
}

/* ---------- Rendering ---------- */
function scrollEnd(){ log.scrollTop = log.scrollHeight; }
function clearChips(){ log.querySelectorAll(".chips").forEach(n => n.remove()); }

function addMsg(role, text, opts){
  opts = opts || {};
  const wrap = document.createElement("div");
  wrap.className = "msg";
  const bub = document.createElement("div");
  bub.className = role === "user" ? "u" : "b" + (opts.error ? " err" : "");
  if(role === "user"){ bub.textContent = text; }
  else {
    const tally = (text.match(/https?:\/\/tally\.so\/[^\s)]+/) || [])[0];
    bub.innerHTML = render(tally ? text.replace(tally,"").replace(/Reservation link:?/i,"") : text);
    wrap.appendChild(bub);
    if(tally){
      const a = document.createElement("a");
      a.className = "cta"; a.href = tally; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "Open reservation form";
      wrap.appendChild(a);
    }
    log.appendChild(wrap);
    return wrap;
  }
  wrap.appendChild(bub); log.appendChild(wrap);
  return wrap;
}
function chipRow(items){
  clearChips();
  if(!items.length) return;
  const row = document.createElement("div"); row.className = "chips";
  items.forEach(([label, text]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = label;
    b.addEventListener("click", () => ask(text));
    row.appendChild(b);
  });
  log.appendChild(row);
}
function suggest(reply){
  if(/tally\.so\//.test(reply)) return [["I have submitted the form","I have submitted the reservation form."]];
  if(/how soon|urgen/i.test(reply)) return [["Now","Now"],["One Month","One Month"],["3 Months","3 Months"]];
  const found = ESTATES.filter(e => reply.toLowerCase().includes(e.toLowerCase()));
  let chips = [];
  if(/which estate|name of the estate|what estate/i.test(reply)) chips = ESTATES.map(e => [e,e]);
  else if(found.length >= 2) chips = found.map(e => [e,"Tell me about "+e]);
  if(/reserve a plot/i.test(reply)) chips.push(["Yes, reserve a plot","Yes, I would like to reserve a plot."]);
  return chips;
}
function showTyping(on){
  const old = $("typing"); if(old) old.remove();
  if(!on) return;
  const t = document.createElement("div");
  t.id = "typing"; t.className = "typing"; t.setAttribute("role","status"); t.setAttribute("aria-label","Assistant is typing");
  t.innerHTML = "<i></i><i></i><i></i>";
  log.appendChild(t); scrollEnd();
}
function setStatus(ok){
  $("status").classList.toggle("off", !ok);
  $("statusText").textContent = ok ? "Online" : "Connection problem";
}

/* ---------- Backend ---------- */
const DEMO = {
  estates: "**Available estates**\n- Gold Town Luxury Estate\n- Juniper Estate\n- Gold Town Phase 3\n\nWould you like to reserve a plot? I can set it up for you now.",
  other: "This is a preview reply. Add your n8n webhook URL in index.html to connect the real assistant."
};
async function callAgent(text){
  if(!CHAT_WEBHOOK_URL){
    await new Promise(r => setTimeout(r, 900));
    return /estate/i.test(text) ? DEMO.estates : DEMO.other;
  }
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
  try{
    const res = await fetch(CHAT_WEBHOOK_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"sendMessage", sessionId, chatInput:text}),
      signal:ctl.signal
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const out = data.output || data.text || data.message || (Array.isArray(data) && data[0] && (data[0].output || data[0].text));
    if(!out) throw new Error("Empty reply");
    return String(out);
  } finally { clearTimeout(timer); }
}

async function ask(text){
  text = (text || "").trim();
  if(!text || busy) return;
  busy = true; sendBtn.disabled = true; lastUserText = text;
  clearChips();
  addMsg("user", text); messages.push({role:"user", text}); save();
  input.value = ""; autosize(); scrollEnd();
  showTyping(true);
  try{
    const reply = await callAgent(text);
    showTyping(false); setStatus(true);
    addMsg("bot", reply); messages.push({role:"bot", text:reply}); save();
    chipRow(suggest(reply));
  }catch(e){
    showTyping(false); setStatus(false);
    addMsg("bot", "I could not reach the assistant. Check your connection, then try again.", {error:true});
    chipRow([["Try again", lastUserText]]);
    // The failed attempt is not stored, so Try again resends cleanly.
    messages.pop(); save();
    const users = log.querySelectorAll(".u"); if(users.length) users[users.length-1].closest(".msg").remove();
  }finally{
    busy = false; sendBtn.disabled = false; scrollEnd(); input.focus({preventScroll:true});
  }
}

/* ---------- Session ---------- */
function paint(){
  log.innerHTML = "";
  addMsg("bot", WELCOME);
  messages.forEach(m => addMsg(m.role, m.text));
  const last = messages[messages.length-1];
  if(!last) chipRow(START_CHIPS);
  else if(last.role === "bot") chipRow(suggest(last.text));
  scrollEnd();
}
function newChat(){
  sessionId = uid(); messages = []; save(); setStatus(true); paint(); input.focus();
}

/* ---------- Composer ---------- */
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(input.value); } });
$("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
$("newTop").addEventListener("click", newChat);
$("newSide").addEventListener("click", newChat);
document.querySelectorAll(".help [data-q]").forEach(b => b.addEventListener("click", () => ask(b.dataset.q)));

paint();
</script>
